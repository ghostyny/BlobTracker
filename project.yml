name: BlobTracker
options:
  bundleIdPrefix: com.blobtracker
  deploymentTarget:
    iOS: "17.0"
targets:
  BlobTracker:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blobtracker.app
        PRODUCT_NAME: BlobTracker
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BlobTracker
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Сохранить готовое видео в галерею"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
